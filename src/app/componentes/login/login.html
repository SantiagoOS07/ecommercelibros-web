<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-header text-center py-3">
          <h1 class="h3 mb-0">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Iniciar sesión
          </h1>
        </div>
        <div class="card-body">
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input type="email" formControlName="correo" class="form-control" placeholder="correo@ejemplo.com" />
              @if (loginForm.get('correo')?.invalid && loginForm.get('correo')?.touched) {
                <div class="text-danger small mt-1">Ingresa un correo electrónico válido.</div>
              }
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" formControlName="contrasenia" class="form-control" placeholder="••••••••" />
              @if (loginForm.get('contrasenia')?.invalid && loginForm.get('contrasenia')?.touched) {
                <div class="text-danger small mt-1">La contraseña debe tener al menos 8 caracteres.</div>
              }
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" [disabled]="!canSubmit()">
                @if (isLoading()) {
                  <span class="spinner-border spinner-border-sm me-2"></span>Ingresando...
                } @else {
                  <i class="fa-solid fa-right-to-bracket me-2"></i>Ingresar
                }
              </button>
            </div>
          </form>
        </div>
        <div class="card-footer text-center small">
          ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
        </div>
      </div>
    </div>
  </div>
</div>
